<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        #calendar {
            display: inline-block;
            text-align: left;
            border: 2px solid #333;
            padding: 20px;
            margin-top: 20px;
            background-color: #fff;
        }

        #calendar table {
            width: 100%;
            border-collapse: collapse;
        }

        #calendar th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        #calendar td {
            width: 14%;
            height: 50px;
            text-align: center;
            font-size: 1.2em;
            padding: 10px;
        }

        .sunday {
            color: red;
            font-weight: bold;
        }

        .holiday {
            color: blue;
            font-weight: bold;
        }

        .normal-day {
            color: green;
        }

        select, button {
            padding: 10px;
            font-size: 1em;
            margin: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Dynamic Calendar</h1>

    <select id="monthSelect">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
    </select>

    <button onclick="generateCalendar()">Generate Calendar</button>

    <div id="calendar"></div>

    <script>
        function generateCalendar() {
            const holidays = {
                0: [1, 25], // January - 1st and 25th
                1: [14],    // February - 14th
                2: [17],    // March - 17th
                3: [12],    // April - 12th
                4: [1],     // May - 1st
                5: [21],    // June - 21st
                6: [4],     // July - 4th
                7: [15],    // August - 15th
                8: [10],    // September - 10th
                9: [25],    // October - 25th
                10: [11],   // November - 11th
                11: [25],   // December - 25th
            };
            const month = document.getElementById('monthSelect').value;
            const currentYear = new Date().getFullYear();
            const firstDay = new Date(currentYear, month, 1);
            const lastDay = new Date(currentYear, parseInt(month) + 1, 0);
            const daysInMonth = lastDay.getDate();

            const calendarDiv = document.getElementById('calendar');
            calendarDiv.innerHTML = ''; // Clear previous calendar

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');

            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekdays.forEach(day => {
                const th = document.createElement('th');
                th.innerText = day;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            let row = document.createElement('tr');
            for (let i = 0; i < firstDay.getDay(); i++) {
                const td = document.createElement('td');
                td.innerText = '';
                row.appendChild(td);
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const td = document.createElement('td');
                td.innerText = day;
                if (holidays[month] && holidays[month].includes(day)) {
                    td.classList.add('holiday');
                }
                else if (new Date(currentYear, month, day).getDay() === 0) {
                    td.classList.add('sunday');
                }
                else {
                    td.classList.add('normal-day');
                }

                row.appendChild(td);
                if (row.children.length === 7) {
                    tbody.appendChild(row);
                    row = document.createElement('tr');
                }
            }
            if (row.children.length > 0) {
                tbody.appendChild(row);
            }

            table.appendChild(tbody);
            calendarDiv.appendChild(table);
        }
    </script>

</body>
</html>
