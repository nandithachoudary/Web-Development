<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trendy Tales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ADD8E6;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 3em;
            font-family: 'Arial', sans-serif;
            color: #FFFFFF; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .product-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 0 10px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 10px;
            background-color: white;
            width: 30%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .product:hover {
            transform: translateY(-10px);
        }

        .product img {
            max-width: 100%;
            height: auto;
            cursor: pointer;
            border-radius: 5px;
        }

        .product h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>The Trendy Tales</h1>

    <div class="product-container">
        <div class="product">
            <h2>FROCKS</h2>
            <a href="https://www.myntra.com/frocks?rawQuery=frocks" target="_blank">
                <img src="frock.png" alt="Frocks">
            </a>
        </div>
        <div class="product">
            <h2>CHUDIDARS</h2>
            <a href="https://www.myntra.com/women-chudidar-material?extra_search_param=isautosuggestentry%3atrue%3a%3aid%3a2297-women-chudidar-material&rawQuery=Women%20Chudidar%20Material" target="_blank">
                <img src="chudidars.png" alt="Chudidars">
            </a>
        </div>
        <div class="product">
            <h2>JUMPSUITS</h2>
            <a href="https://www.myntra.com/jumpsuits?rawQuery=jumpsuits" target="_blank">
                <img src="jumpsuit.png" alt="Jumpsuits">
            </a>
        </div>
    </div>

</body>
</html>
